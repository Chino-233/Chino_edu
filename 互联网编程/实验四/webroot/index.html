<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chino HTTP服务器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Chino HTTP服务器首页</h1>
        <p>这是HTTP服务器的默认首页，服务器会自动加载此页面。</p>
        
        <img src="test.jpg" alt="测试图片" class="image">
        
        <div class="features">
            <h2>服务器特性</h2>

                <li>支持GET、HEAD和POST请求</li>

        </div>
        
        <div class="links">
            <h2>测试链接</h2>
            <ul>
                <li><a href="a.html">测试页面 A</a></li>
                <li><a href="login.html">登录页面</a></li>
            </ul>
        </div>
        
        <div class="footer">
            <p>互联网编程 - 实验四</p>
            <p>HTTP服务器和客户端实现</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
